name: Build KornDog TV APK

on:
  push:
    branches:
      - korndog-tv
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platforms;android-36"             "build-tools;36.0.0"             "platform-tools"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Restore KornDog signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KORNDOG_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KORNDOG_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KORNDOG_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > korndog-release.jks

          cat > keystore.properties <<EOF
          storeFile=korndog-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=korndog
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Verify restored signing key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KORNDOG_KEYSTORE_PASSWORD }}
        run: |
          keytool -list             -keystore korndog-release.jks             -alias korndog             -storepass "$KEYSTORE_PASSWORD" >/dev/null
          echo "Signing key verified"

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --build-cache

      - name: Name release APK
        run: |
          OUTPUT="KornDog-TV-v3.2.${GITHUB_RUN_NUMBER}-build-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUTPUT"
          echo "OUTPUT_APK=$OUTPUT" >> "$GITHUB_ENV"

      - name: Upload KornDog TV release
        uses: actions/upload-artifact@v4
        with:
          name: KornDog-TV-v3.2.${{ github.run_number }}
          path: ${{ env.OUTPUT_APK }}
          if-no-files-found: error

      - name: Copy to stable filename for release
        run: cp "${{ env.OUTPUT_APK }}" KornDog-TV-latest.apk

      - name: Publish/refresh "latest" release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-korndog-tv
          name: KornDog TV (latest, run ${{ github.run_number }})
          body: |
            Automatically rebuilt from the latest push to korndog-tv (commit ${{ github.sha }}).
            This release is overwritten on every push - use the stable download link below on
            the TV via Downloader, no GitHub login needed.
          prerelease: true
          files: KornDog-TV-latest.apk
