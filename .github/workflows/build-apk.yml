name: Build KornDog TV APK

on:
  push:
    branches:
      - korndog-tv
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platforms;android-36"             "build-tools;36.0.0"             "platform-tools"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --build-cache

      - name: Name release APK
        run: |
          OUTPUT="KornDog-TV-v3.2.${GITHUB_RUN_NUMBER}-build-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$OUTPUT"
          echo "OUTPUT_APK=$OUTPUT" >> "$GITHUB_ENV"

      - name: Upload KornDog TV release
        uses: actions/upload-artifact@v4
        with:
          name: KornDog-TV-v3.2.${{ github.run_number }}
          path: ${{ env.OUTPUT_APK }}
          if-no-files-found: error
