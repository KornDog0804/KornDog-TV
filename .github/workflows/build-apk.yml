name: Build KornDog TV APK

on:
  push:
    branches:
      - korndog-tv
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Rename KornDog TV APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/KornDog-TV-debug.apk

      - name: Upload KornDog TV APK
        uses: actions/upload-artifact@v4
        with:
          name: KornDog-TV-debug
          path: app/build/outputs/apk/debug/KornDog-TV-debug.apk
          if-no-files-found: error
